<script>
'use strict';
const TOPICS = JSON.parse(document.getElementById('topic-data').textContent);
const BY_ID = new Map(TOPICS.map(q => [q.id,q]));
const STORAGE_KEY = 'closer-topics-demo-v1';
const NAMES = {'1':'轻轻聊','2':'多懂你一点','3':'再靠近一点'};
const GENTLE_LINES = ['愿意分享多少，都由你决定','不着急，慢慢来','安静一会儿，也没关系','没有标准答案，说说你的感受就好','不想聊的，就轻轻跳过','先听对方说完，不急着给建议','一个小小的故事，也值得被认真听见','今天聊到这里，也很好'];
const $ = id => document.getElementById(id);
const SOUND_KEY='closer-topics-sound';
const SOUND_SUPPORTED=Boolean(window.AudioContext || window.webkitAudioContext);
let soundMuted=false;
try{soundMuted=localStorage.getItem(SOUND_KEY)==='off';}catch{}
let audioContext=null;
let audioMaster=null;
let audioReadyPromise=null;
let activeReel=null;
let soundGeneration=0;
const soundingNodes=new Set();
function renderSound(){
 $('sound-toggle').disabled=!SOUND_SUPPORTED;
 $('sound-toggle').setAttribute('aria-pressed',String(SOUND_SUPPORTED && !soundMuted));
 const label=!SOUND_SUPPORTED?'当前浏览器不支持音效':soundMuted?'开启音效':'关闭音效';
 $('sound-toggle').setAttribute('aria-label',label);$('sound-toggle').setAttribute('title',label);
 $('sound-label').textContent=!SOUND_SUPPORTED?'音效不可用':soundMuted?'音效关':'音效开';
 $('sound-waves').style.display=soundMuted || !SOUND_SUPPORTED?'none':'';
 $('sound-cross').style.display=soundMuted || !SOUND_SUPPORTED?'':'none';
}
function unlockAudio(){
 if(soundMuted || !SOUND_SUPPORTED || document.hidden)return Promise.resolve(false);
 try{
  if(!audioContext){const Audio=window.AudioContext || window.webkitAudioContext;audioContext=new Audio();audioMaster=audioContext.createGain();audioMaster.gain.value=.6;audioMaster.connect(audioContext.destination);}
  if(audioContext.state==='running')return Promise.resolve(true);
  if(!audioReadyPromise)audioReadyPromise=Promise.resolve(audioContext.resume()).then(()=>audioContext.state==='running').catch(()=>false).finally(()=>{audioReadyPromise=null;});
  return audioReadyPromise;
 }catch{return Promise.resolve(false);}
}
function stopSounds(){
 soundGeneration++;
 for(const record of [...soundingNodes]){try{record.source.stop();}catch{}try{record.source.disconnect();record.envelope.disconnect();}catch{}soundingNodes.delete(record);}
}
function tone(frequency,time,duration,volume,type='sine'){
 if(soundMuted || document.hidden || !audioContext || audioContext.state!=='running')return;
 try{
  const source=audioContext.createOscillator(),envelope=audioContext.createGain();
  source.type=type;source.frequency.setValueAtTime(frequency,time);source.frequency.exponentialRampToValueAtTime(Math.max(100,frequency*.38),time+duration);
  envelope.gain.setValueAtTime(.0001,time);envelope.gain.exponentialRampToValueAtTime(volume,time+.003);envelope.gain.exponentialRampToValueAtTime(.0001,time+duration);
  source.connect(envelope);envelope.connect(audioMaster);
  const record={source,envelope};soundingNodes.add(record);
  source.onended=()=>{source.disconnect();envelope.disconnect();soundingNodes.delete(record);};
  source.start(time);source.stop(time+duration+.012);
 }catch{/* Sound is optional; never interrupt drawing. */}
}
function playClick(){if(audioContext)tone(440,audioContext.currentTime,.055,.12,'triangle');}
function playLanding(){if(audioContext){const now=audioContext.currentTime;tone(660,now,.11,.09,'sine');tone(990,now+.035,.13,.035,'sine');}}
// Match each paper-row crossing to the same cubic Bézier used by the visual roll.
function reelTickTimes(){
 const bezier=(u,a,b)=>3*(1-u)*(1-u)*u*a+3*(1-u)*u*u*b+u*u*u;
 return Array.from({length:20},(_,index)=>{const target=(index+1)/20;let lo=0,hi=1;for(let i=0;i<32;i++){const mid=(lo+hi)/2;if(bezier(mid,.65,1)<target)lo=mid;else hi=mid;}return 2800*bezier((lo+hi)/2,.12,.17);});
}
function scheduleRollSounds(animation){
 if(!audioContext || soundMuted || document.hidden || !spinning)return;
 const elapsed=Number(animation.currentTime)||0;
 for(const ms of reelTickTimes())if(ms>elapsed+10 && ms<2750)tone(600,audioContext.currentTime+(ms-elapsed)/1000,.035,.095,'triangle');
}
async function toggleSound(){
 soundMuted=!soundMuted;
 try{localStorage.setItem(SOUND_KEY,soundMuted?'off':'on');}catch{}
 stopSounds();renderSound();
 if(!soundMuted){const generation=soundGeneration;if(await unlockAudio())if(generation===soundGeneration){playClick();if(activeReel)scheduleRollSounds(activeReel);}}
}
let storageOK = true;
function freshState(){return {version:1,level:'1',seen:[],currentId:null};}
function normalizeState(value){
 if(!value || value.version!==1) return freshState();
 const level=typeof value.level==='string' && Object.hasOwn(NAMES,value.level) ? value.level : '1';
 const seen=Array.isArray(value.seen) ? [...new Set(value.seen.filter(id=>BY_ID.has(id)))] : [];
 const current=BY_ID.get(value.currentId);
 const currentId=current && String(current.level)===level ? current.id : null;
 if(currentId!==null && !seen.includes(currentId)) seen.push(currentId);
 return {version:1,level,seen,currentId};
}
function readState(){let raw;try{raw=localStorage.getItem(STORAGE_KEY);}catch{storageOK=false;return freshState();}try{return normalizeState(JSON.parse(raw));}catch{return freshState();}}
let state=readState();
let spinning=false;
let tipIndex=0;
let tipInterval=null;
let tipTimeout=null;
let tipChanging=false;
function pool(level=state.level){return TOPICS.filter(q=>String(q.level)===level);}
function remaining(level=state.level){const seen=new Set(state.seen);return pool(level).filter(q=>!seen.has(q.id));}
function save(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state));}catch{storageOK=false;}$('storage-note').hidden=storageOK;$('storage-note').textContent=storageOK?'':'当前浏览器无法保存进度，本页仍可正常抽题。';}
function randomItem(items){return items[Math.floor(Math.random()*items.length)];}
function reducedMotion(){return Boolean(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);}
function displayQuestion(text){
 if(text.length>22) return text;
 const split=text.indexOf('，');
 return split>=7 && split<text.length-6 ? text.slice(0,split+1)+'\n'+text.slice(split+1) : text;
}
function render(){
 const current=BY_ID.get(state.currentId);
 const available=remaining();
 document.querySelectorAll('[data-level]').forEach(button=>{button.setAttribute('aria-pressed',String(button.dataset.level===state.level));button.disabled=spinning;});
 $('draw').disabled=spinning;
 $('draw').textContent=spinning?'正在靠近…':available.length?'抽一个话题':'再聊一轮';
 $('skip').disabled=spinning || !current || !available.length;
 $('exhausted').hidden=spinning || available.length>0;
 $('card').setAttribute('aria-busy',String(spinning));
 $('rest').hidden=spinning;
 $('reel').hidden=!spinning;
 if(spinning) return;
 const text=current?current.question:'从一个话题开始，慢慢认识彼此。';
 $('question').textContent=displayQuestion(text);
 $('question').className='question'+(text.length>22?' long':'');
 const options=pool();
 const index=current?options.findIndex(q=>q.id===current.id):0;
 $('previous').textContent=options[(index-1+options.length)%options.length].question;
 $('next').textContent=options[(index+1)%options.length].question;
}
function stopTipTimer(){
 if(tipInterval!==null){clearInterval(tipInterval);tipInterval=null;}
 if(tipTimeout!==null){clearTimeout(tipTimeout);tipTimeout=null;}
 tipChanging=false;
 $('gentle-text').classList.remove('changing');
}
function rotateTip(){
 if(document.hidden || spinning || tipChanging) return;
 const apply=()=>{tipTimeout=null;tipIndex=(tipIndex+1)%GENTLE_LINES.length;$('gentle-text').textContent=GENTLE_LINES[tipIndex];$('gentle-text').classList.remove('changing');tipChanging=false;};
 if(reducedMotion()){apply();return;}
 tipChanging=true;
 $('gentle-text').classList.add('changing');
 tipTimeout=setTimeout(apply,650);
}
function startTipTimer(){stopTipTimer();if(!document.hidden && !spinning)tipInterval=setInterval(rotateTip,15000);}
async function draw(){
 if(spinning) return;
 stopSounds();
 const generation=soundGeneration;
 const audioReady=unlockAudio();
 let didAnimate=false;
 audioReady.then(ready=>{if(ready && generation===soundGeneration)playClick();}).catch(()=>{});
 let available=remaining();
 if(!available.length){const ids=new Set(pool().map(q=>q.id));state.seen=state.seen.filter(id=>!ids.has(id));available=remaining();}
 const selected=randomItem(available);
 spinning=true;stopTipTimer();render();
 $('announcement').textContent='正在抽取话题';
 try{
  const track=$('track');track.replaceChildren();
  const options=pool();const selectedIndex=options.findIndex(q=>q.id===selected.id);
  const sequence=Array.from({length:23},()=>randomItem(options));
  sequence[20]=options[(selectedIndex-1+options.length)%options.length];sequence[21]=selected;sequence[22]=options[(selectedIndex+1)%options.length];
  sequence.forEach(q=>{const row=document.createElement('div');row.className='reel-row'+(q.question.length>22?' long':'');row.textContent=displayQuestion(q.question);track.append(row);});
  if(!reducedMotion() && typeof track.animate==='function'){
   const animation=track.animate([{transform:'translateY(0)'},{transform:'translateY(calc(var(--row) * -20))'}],{duration:2800,easing:'cubic-bezier(.12,.65,.17,1)',fill:'forwards'});
   didAnimate=true;activeReel=animation;
   audioReady.then(ready=>{if(ready && generation===soundGeneration)scheduleRollSounds(animation);}).catch(()=>{});
   try{await animation.finished;}finally{animation.cancel();activeReel=null;}
  }
 }catch{/* Keep drawing functional if the browser does not support the visual effect. */}
 if(didAnimate){stopSounds();playLanding();}
 state.seen.push(selected.id);state.currentId=selected.id;spinning=false;save();render();startTipTimer();
 $('announcement').textContent=selected.question;
}
function selectLevel(level){
 if(spinning || !Object.hasOwn(NAMES,level) || level===state.level) return;
 stopSounds();const generation=soundGeneration;unlockAudio().then(ready=>{if(ready && generation===soundGeneration)playClick();}).catch(()=>{});
 state.level=level;state.currentId=null;save();render();
 $('announcement').textContent=`已选择${NAMES[level]}`;
}
$('draw').addEventListener('click',draw);
$('skip').addEventListener('click',draw);
$('sound-toggle').addEventListener('click',toggleSound);
document.querySelectorAll('[data-level]').forEach(button=>button.addEventListener('click',()=>selectLevel(button.dataset.level)));
document.addEventListener('visibilitychange',()=>{if(document.hidden){stopTipTimer();stopSounds();}else startTipTimer();});
window.addEventListener('pagehide',()=>{stopTipTimer();stopSounds();});
window.addEventListener('pageshow',startTipTimer);
save();render();renderSound();startTipTimer();
</script>
